<body>
    <script>
        function sortArrayAscending(arr) {
            return [...arr].sort((a, b) => a - b);
        }
        const arr1 = [3, 8, 7, 6, 5, -4, 3, 2, 1];
        console.log("Q14:", sortArrayAscending(arr1).join(","));
    </script>
</body>
