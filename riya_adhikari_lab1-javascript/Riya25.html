<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const personAccount = {
            firstName: "Riya",
            lastName: "Adhikari",
            incomes: [{ amount: 60000, description: "Salary" }],
            expenses: [{ amount: 18000, description: "Rent" }],
 
            totalIncome() {
                return this.incomes.reduce((sum, i) => sum + i.amount, 0);
            },
            totalExpense() {
                return this.expenses.reduce((sum, e) => sum + e.amount, 0);
            },
            accountBalance() {
                return this.totalIncome() - this.totalExpense();
            },
            addIncome(amount, description) {
                this.incomes.push({ amount, description });
            },
            addExpense(amount, description) {
                this.expenses.push({ amount, description });
            },
            accountInfo() {
                return `${this.firstName} ${this.lastName} - Balance: ${this.accountBalance()}`;
            }
        };
        personAccount.addIncome(10000, "Freelance");
        personAccount.addExpense(2000, "Groceries");
        console.log("Q25:", personAccount.accountInfo());
    </script>
</body>
</html>
