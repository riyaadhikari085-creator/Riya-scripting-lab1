<!DOCTYPE html>
<html>
<head>
    <title>Capitalize Words</title>
</head>
<body>

<script>
    function capitalizeWords(str) {
        return str
        .split(" ")
        .map(word => word.charAt(0).toUpperCase() + word.slice(1))
        .join(" ");
    }
    console.log("Q4:", capitalizeWords("the quick brown fox"));
</script>

</body>
</html>
