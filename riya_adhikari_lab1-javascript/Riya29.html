<!DOCTYPE html>
<html lang="en">
<head>
<style>
  #container, #userContainer { display: flex; flex-wrap: wrap; max-width: 700px; }
  #container span, #userContainer span {
    display: inline-block; width: 32px; height: 32px; margin: 2px;
    text-align: center; line-height: 32px; border-radius: 4px; color: white;
  }
  .even { background: rgb(11, 0, 128); }
  .odd { background: rgb(255, 0, 0); }
  .prime { background: rgb(0, 255, 4); }
</style> 
</head>
<body>
 
  <h3>Q29: Numbers 0 - 100</h3>
  <div id="container"></div>

    <script>
        
        function isPrime(n) {
            if (n < 2) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i === 0) return false;
            }
            return true;
        }

       
        function classify(n) {
            if (isPrime(n)) return "prime";
            return n % 2 === 0 ? "even" : "odd";
        }
        const container = document.getElementById("container");
        for (let i = 0; i <= 100; i++) {
          const span = document.createElement("span");
          span.textContent = i;
          span.classList.add(classify(i));
          container.appendChild(span);
        }
    </script>

</body>
</html>
