<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function largestOfFive(nums) {
          return Math.max(...nums);
          }
       
        let nums = [];
         for (let i = 1; i <= 5; i++) nums.push(Number(prompt(`Enter number ${i}:`)));
         alert("Largest number is: " + largestOfFive(nums));
        
   </script>
</body>
</html>
