<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #de95b9, #6d86f6);
            padding: 30px;
        }

        form {
            width: 500px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 15px #555;
        }

        h2 {
            text-align: center;
            color: #673ab7;
            background-color: #e8dff5;
            padding: 10px;
            border-radius: 8px;
        }

        label {
            display: inline-block;
            width: 120px;
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"],
        select {
            width: 300px;
            padding: 8px;
            border: 2px solid #64b5f6;
            border-radius: 6px;
        }

        input:focus,
        select:focus {
            border-color: #673ab7;
            outline: none;
            background-color: #f3e5f5;
        }

        input[type="radio"] {
            margin: 8px;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-left: 125px;
        }

        button {
            padding: 10px 25px;
            margin: 15px 5px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        #submit {
            background-color: #4CAF50;
        }

        #reset {
            background-color: #f44336;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<form onsubmit="return validateForm()">

    <h2>Student Registration Form</h2>

    <label>Name:</label>
    <input type="text" id="name">
    <div id="nameError" class="error"></div>

    <label>Address:</label>
    <input type="text" id="address">
    <div id="addressError" class="error"></div>

    <label>Username:</label>
    <input type="text" id="username">
    <div id="usernameError" class="error"></div>

    <label>Email:</label>
    <input type="text" id="email">
    <div id="emailError" class="error"></div>

    <label>Password:</label>
    <input type="password" id="password">
    <div id="passwordError" class="error"></div>

    <label>Phone:</label>
    <input type="text" id="phone">
    <div id="phoneError" class="error"></div>

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female
    <div id="genderError" class="error"></div>

    <label>Course:</label>
    <select id="course">
        <option value="">-- Select Course --</option>
        <option value="BCA">BCA</option>
        <option value="BIM">BIM</option>
        <option value="CSIT">CSIT</option>
        <option value="BBM">BBM</option>
    </select>
    <div id="courseError" class="error"></div>

    <center>
        <button id="submit" type="submit">Submit</button>
        <button id="reset" type="reset" onclick="clearErrors()">Reset</button>
    </center>

</form>

<script>

function validateForm() {

    let valid = true;
    clearErrors();

    let name = document.getElementById("name").value.trim();
    let address = document.getElementById("address").value.trim();
    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let phone = document.getElementById("phone").value.trim();
    let course = document.getElementById("course").value;

    // Name validation
    if (name == "") {
        document.getElementById("nameError").innerHTML =
            "Name cannot be empty";
        valid = false;
    }
    else if (!/^[A-Za-z ]+$/.test(name)) {
        document.getElementById("nameError").innerHTML =
            "Name must not contain numbers";
        valid = false;
    }

    // Address validation
    if (address == "") {
        document.getElementById("addressError").innerHTML =
            "Address cannot be empty";
        valid = false;
    }

    // Username validation
    if (username == "") {
        document.getElementById("usernameError").innerHTML =
            "Username cannot be empty";
        valid = false;
    }
    else if (!/^[A-Za-z0-9_]+$/.test(username)) {
        document.getElementById("usernameError").innerHTML =
            "Only letters, numbers and underscore allowed";
        valid = false;
    }

    // Email validation
    if (email == "") {
        document.getElementById("emailError").innerHTML =
            "Email cannot be empty";
        valid = false;
    }
    else if (!email.includes("@")) {
        document.getElementById("emailError").innerHTML =
            "Email must contain @";
        valid = false;
    }

    // Password validation
    if (password == "") {
        document.getElementById("passwordError").innerHTML =
            "Password cannot be empty";
        valid = false;
    }
    else if (password.length < 8) {
        document.getElementById("passwordError").innerHTML =
            "Password must be at least 8 characters";
        valid = false;
    }
    else if (!/[A-Z]/.test(password)) {
        document.getElementById("passwordError").innerHTML =
            "Password needs an uppercase letter";
        valid = false;
    }
    else if (!/[a-z]/.test(password)) {
        document.getElementById("passwordError").innerHTML =
            "Password needs a lowercase letter";
        valid = false;
    }
    else if (!/[0-9]/.test(password)) {
        document.getElementById("passwordError").innerHTML =
            "Password needs a number";
        valid = false;
    }
    else if (!/[^A-Za-z0-9]/.test(password)) {
        document.getElementById("passwordError").innerHTML =
            "Password needs a special character";
        valid = false;
    }

    // Phone validation
    if (phone == "") {
        document.getElementById("phoneError").innerHTML =
            "Phone cannot be empty";
        valid = false;
    }
    else if (!/^(98|97|96)[0-9]{8}$/.test(phone)) {
        document.getElementById("phoneError").innerHTML =
            "Phone must start with 98, 97 or 96 and contain 10 digits";
        valid = false;
    }

    // Gender validation
    let gender = document.querySelector(
        'input[name="gender"]:checked'
    );

    if (!gender) {
        document.getElementById("genderError").innerHTML =
            "Please select gender";
        valid = false;
    }

    // Course validation
    if (course == "") {
        document.getElementById("courseError").innerHTML =
            "Please select a course";
        valid = false;
    }

    if (valid) {
        alert("Form submitted successfully!");
    }

    return valid;
}

function clearErrors() {
    document.getElementById("nameError").innerHTML = "";
    document.getElementById("addressError").innerHTML = "";
    document.getElementById("usernameError").innerHTML = "";
    document.getElementById("emailError").innerHTML = "";
    document.getElementById("passwordError").innerHTML = "";
    document.getElementById("phoneError").innerHTML = "";
    document.getElementById("genderError").innerHTML = "";
    document.getElementById("courseError").innerHTML = "";
}

</script>

</body>
</html>
