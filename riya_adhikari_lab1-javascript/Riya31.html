<!DOCTYPE html>
<html>
<body>

<script>
let n = prompt("Enter a number:");

for (let i = 1; i <= n; i++) {
    let prime = i > 1;

    for (let j = 2; j < i; j++)
        if (i % j == 0) prime = false;

    if (prime)
        document.write("<span style='color:violet'>" + i + " </span>");
    else if (i % 2 == 0)
        document.write("<span style='color:purple'>" + i + " </span>");
    else
        document.write("<span style='color:pink'>" + i + " </span>");
}
</script>

</body>
</html>
