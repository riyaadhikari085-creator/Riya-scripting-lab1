<!DOCTYPE html>
<html lang="en">

    <title>Document</title>
</head>
<body>
    <script>
        function reverseNumber(num) {
             let reversed = num
            .toString()
            .split("")
            .reverse()
            .join("");
             return num < 0 ? "-" + reversed.replace("-", "") : reversed;
        }
         console.log("Q1:", reverseNumber(12345));       
    </script>
</body>
</html>
