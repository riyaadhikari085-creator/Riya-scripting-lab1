<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>

    <style>
         body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(90deg, rgb(242, 164, 242), rgb(103, 103, 234));
            margin-top: 80px;
        }

        h1 {
            color: white;
            font-size: 35px;
        }

        .clock {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .time-box {
            background-color: white;
            width: 110px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: 40px;
            font-weight: bold;
        }

        .colon {
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>DIGITAL CLOCK</h1>

    <div class="clock">

        <div class="time-box" id="hours">00</div>

        <div class="colon">:</div>

        <div class="time-box" id="minutes">00</div>

        <div class="colon">:</div>

        <div class="time-box" id="seconds">00</div>

    </div>

    <script>
        function updateClock() {

            let currentTime = new Date();

            let hours = currentTime.getHours();
            let minutes = currentTime.getMinutes();
            let seconds = currentTime.getSeconds();

            // Add zero before single digit numbers
            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }

        // Update the clock every second
        setInterval(updateClock, 1000);

        // Show the time immediately
        updateClock();
    </script>

</body>
</html>
